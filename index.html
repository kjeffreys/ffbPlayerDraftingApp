<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football Draft Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-bg: #161613;
            --color-surface: #22211d;
            --color-surface-2: #2c2a25;
            --color-surface-hover: #37342d;
            --color-border: #444037;
            --color-text-primary: #f7f3ea;
            --color-text-secondary: #b7aea1;
            --color-accent: #2f8f6b;
            --color-accent-hover: #247756;
            --color-danger: #c94c4c;
            --color-warning: #c58a2a;

            --pos-qb: #d45b5b;
            --pos-rb: #4f94c8;
            --pos-wr: #42b883;
            --pos-te: #d98d45;
            --pos-k: #9a78c8;
            --pos-def: #9c9488;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            margin: 0;
            padding: 1rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #root {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 1320px;
            margin: 0 auto;
        }

        button,
        input,
        select {
            font-family: 'Inter', sans-serif;
        }

        button {
            border: none;
            border-radius: 0.375rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
            background: var(--color-surface-2);
            color: var(--color-text-primary);
            border: 1px solid var(--color-border);
        }

        button:hover:not(:disabled) {
            background: var(--color-surface-hover);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        input,
        select {
            background: var(--color-bg);
            color: var(--color-text-primary);
            border: 1px solid var(--color-border);
            border-radius: 0.375rem;
            padding: 0.5rem 0.65rem;
        }

        h1,
        h2,
        h3 {
            margin: 0;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            padding: 1rem;
            background: rgba(34, 33, 29, 0.96);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .headerTop,
        .toolbar,
        .headerActions,
        .cardActions,
        .concernBar,
        .viewControls {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .headerTop {
            justify-content: space-between;
        }

        .toolbar {
            justify-content: space-between;
        }

        .toolbar.compact {
            justify-content: flex-start;
        }

        .toolbar label {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            color: var(--color-text-secondary);
            font-size: 0.88rem;
        }

        .eyebrow {
            color: var(--color-accent);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .muted {
            color: var(--color-text-secondary);
            font-size: 0.86rem;
        }

        .dataBanner {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
            padding: 0.65rem 0.8rem;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-surface);
            color: var(--color-text-secondary);
            font-size: 0.88rem;
        }

        .dataBanner strong {
            color: var(--color-text-primary);
        }

        .dataDetail {
            color: var(--color-text-secondary);
        }

        .dataBanner.warning {
            border-color: rgba(214, 74, 82, 0.65);
        }

        .dataBanner.ready {
            border-color: rgba(47, 143, 107, 0.65);
        }

        .searchBox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            min-width: min(100%, 320px);
            max-width: 620px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 0.35rem;
        }

        .searchBox input {
            flex: 1;
            min-width: 120px;
            border: 0;
            outline: 0;
            background: transparent;
        }

        .segmented {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.2rem;
            background: var(--color-bg);
            border-radius: 8px;
            border: 1px solid var(--color-border);
        }

        .segmented.subtle {
            padding-left: 0.55rem;
        }

        .segmentLabel {
            color: var(--color-text-secondary);
            font-size: 0.82rem;
            margin-right: 0.15rem;
        }

        .utilityViews button {
            padding-inline: 0.75rem;
        }

        .cockpitLayout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 280px;
            gap: 1rem;
            align-items: start;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .backupGrid,
        .gridPanel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 0.75rem;
        }

        .panel,
        .recCard,
        .playerRow,
        .empty {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
        }

        .panel,
        .recCard,
        .empty {
            padding: 1rem;
        }

        .recCard {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .recCard.featured {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 1px rgba(47, 143, 107, 0.35);
        }

        .recHeader,
        .drawerRow,
        .playerRow {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 0.75rem;
            align-items: center;
        }

        .rankBadge,
        .rowRank {
            width: 2.2rem;
            height: 2.2rem;
            display: grid;
            place-items: center;
            background: var(--color-accent);
            border-radius: 8px;
            font-weight: 800;
        }

        .playerMain {
            min-width: 0;
        }

        .playerMain strong,
        .playerMain h2 {
            overflow-wrap: anywhere;
        }

        .scoreBlock {
            text-align: right;
        }

        .score {
            font-size: 1.35rem;
            font-weight: 800;
        }

        .reasonList {
            display: grid;
            gap: 0.35rem;
            color: var(--color-text-primary);
        }

        .tagRow {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-top: 0.45rem;
        }

        .marketTag {
            display: inline-flex;
            align-items: center;
            min-height: 1.5rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0.18rem 0.5rem;
            background: var(--color-surface-2);
            color: var(--color-text-primary);
            font-size: 0.74rem;
            font-weight: 700;
        }

        .market-buy-ahead {
            background: rgba(66, 184, 131, 0.18);
            color: #c7f7df;
        }

        .market-fair-at-cost {
            background: rgba(79, 148, 200, 0.18);
            color: #d6ecff;
        }

        .market-let-fall {
            background: rgba(197, 138, 42, 0.2);
            color: #ffe2aa;
        }

        .market-risk-discount-needed,
        .market-discount-with-reason {
            background: rgba(217, 141, 69, 0.22);
            color: #ffd9bd;
        }

        .market-trap {
            background: rgba(201, 76, 76, 0.22);
            color: #ffd2d2;
        }

        .market-late-only,
        .subtleTag {
            background: rgba(154, 120, 200, 0.2);
            color: #eadfff;
        }

        .riskTag {
            background: rgba(201, 76, 76, 0.18);
            color: #ffd2d2;
        }

        .noteGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 0.55rem;
        }

        .noteBlock {
            display: grid;
            gap: 0.25rem;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 0.65rem;
            color: var(--color-text-secondary);
            font-size: 0.84rem;
            line-height: 1.35;
        }

        .noteBlock strong {
            color: var(--color-text-primary);
        }

        .componentGrid,
        .rosterGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
            gap: 0.5rem;
        }

        .componentGrid>div,
        .rosterGrid>div {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 0.5rem;
        }

        .primary {
            background: var(--color-accent);
        }

        .danger {
            background: var(--color-danger);
        }

        .concernBar button {
            padding: 0.35rem 0.6rem;
            font-size: 0.8rem;
        }

        .drawerButton {
            width: 100%;
        }

        .drawerList {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .drawerRow {
            grid-template-columns: auto minmax(0, 1fr) auto auto;
            padding: 0.65rem;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 6px;
        }

        .playerRow {
            grid-template-columns: 5px minmax(180px, 1fr) repeat(3, minmax(62px, auto)) auto auto;
            padding: 0.7rem;
        }

        .playerRow.avoided {
            opacity: 0.58;
        }

        .classicBoard {
            display: flex;
            flex-direction: column;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .classicHeader,
        .classicRow {
            display: grid;
            grid-template-columns: 64px minmax(240px, 1fr) 72px 64px 64px 86px 86px 78px;
            gap: 0.75rem;
            align-items: center;
            padding: 0.7rem 0.85rem;
        }

        .classicHeader > :nth-child(n + 3),
        .classicRow > :nth-child(n + 3) {
            justify-self: center;
        }

        .classicHeader > :nth-child(2),
        .classicRow > :nth-child(2) {
            justify-self: stretch;
        }

        .classicRow button {
            justify-self: end;
            width: 64px;
        }

        .classicHeader {
            background: var(--color-surface-2);
            color: var(--color-text-secondary);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid var(--color-border);
        }

        .classicRow {
            min-height: 54px;
            border-bottom: 1px solid var(--color-border);
        }

        .classicRow:nth-child(odd) {
            background: rgba(255, 255, 255, 0.018);
        }

        .classicRow:last-child {
            border-bottom: 0;
        }

        .draftLog {
            display: flex;
            flex-direction: column;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .draftHeader,
        .draftRow {
            display: grid;
            grid-template-columns: 72px minmax(220px, 1fr) minmax(140px, 0.8fr) 72px 64px 64px 84px 78px;
            gap: 0.75rem;
            align-items: center;
            padding: 0.7rem 0.85rem;
        }

        .draftHeader {
            background: var(--color-surface-2);
            color: var(--color-text-secondary);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid var(--color-border);
        }

        .draftRow {
            min-height: 54px;
            border-bottom: 1px solid var(--color-border);
        }

        .draftRow:nth-child(odd) {
            background: rgba(255, 255, 255, 0.018);
        }

        .draftRow:last-child {
            border-bottom: 0;
        }

        .draftHeader > :nth-child(n + 4),
        .draftRow > :nth-child(n + 4) {
            justify-self: center;
        }

        .draftRow button {
            justify-self: end;
            width: 64px;
        }

        .classicRank {
            color: var(--color-text-secondary);
            font-weight: 700;
        }

        .classicPlayer {
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .positionPill {
            display: inline-flex;
            min-width: 42px;
            justify-content: center;
            border: 1px solid var(--color-border);
            border-radius: 999px;
            padding: 0.16rem 0.4rem;
            font-weight: 700;
            font-size: 0.78rem;
        }

        .posStripe {
            align-self: stretch;
            border-radius: 999px;
        }

        .chipWrap {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }

        .chip {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 999px;
            padding: 0.35rem 0.55rem;
            font-size: 0.84rem;
        }

        .rosterPanel {
            position: sticky;
            top: 160px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .empty {
            text-align: center;
            color: var(--color-text-secondary);
        }

        @media (max-width: 860px) {
            body {
                padding: 0.6rem;
            }

            .cockpitLayout {
                grid-template-columns: 1fr;
            }

            .rosterPanel {
                position: static;
            }

            .playerRow,
            .drawerRow {
                grid-template-columns: auto minmax(0, 1fr);
            }

            .classicBoard,
            .draftLog {
                overflow-x: auto;
            }

            .classicHeader,
            .classicRow,
            .draftHeader,
            .draftRow {
                min-width: 820px;
            }
            .scoreBlock {
                text-align: left;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 0.45rem;
            }

            h1 {
                font-size: 2.15rem;
                line-height: 1;
            }

            .dataBanner {
                margin-bottom: 0.45rem;
                padding: 0.45rem 0.55rem;
                gap: 0.35rem;
                font-size: 0.76rem;
            }

            .dataDetail {
                display: none;
            }

            .header {
                position: static;
                gap: 0.55rem;
                padding: 0.7rem;
            }

            .headerTop {
                display: grid;
                grid-template-columns: 1fr;
                gap: 0.45rem;
            }

            .headerTop .muted {
                font-size: 0.78rem;
            }

            .headerActions {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                width: 100%;
                gap: 0.45rem;
            }

            .headerActions select {
                grid-column: 1 / -1;
                width: 100%;
            }

            .headerActions button,
            .toolbar button {
                min-height: 2.35rem;
                padding: 0.45rem 0.5rem;
            }

            .toolbar {
                align-items: stretch;
                gap: 0.45rem;
            }

            .searchBox {
                width: 100%;
                min-width: 100%;
                max-width: none;
                gap: 0.35rem;
                padding: 0.28rem;
            }

            .searchBox input {
                min-width: 0;
                font-size: 0.88rem;
            }

            .searchBox button {
                white-space: nowrap;
            }

            .viewControls {
                display: grid;
                grid-template-columns: 1fr;
                width: 100%;
                gap: 0.4rem;
            }

            .segmented {
                width: 100%;
                box-sizing: border-box;
            }

            .segmented button {
                flex: 1;
                min-width: 0;
            }

            .segmentLabel {
                font-size: 0.78rem;
            }

            .toolbar.compact {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                align-items: end;
            }

            .toolbar.compact label {
                display: grid;
                grid-template-columns: 1fr;
                align-items: start;
                gap: 0.25rem;
                font-size: 0.78rem;
            }

            .toolbar.compact label:nth-child(2) {
                grid-column: 1 / -1;
            }

            .toolbar.compact input,
            .toolbar.compact select,
            .toolbar.compact button {
                width: 100%;
                min-width: 0;
                box-sizing: border-box;
            }

            .toolbar.compact > button {
                display: none;
            }

            .recCard,
            .panel {
                padding: 0.75rem;
            }

            .recHeader {
                grid-template-columns: auto minmax(0, 1fr);
                gap: 0.65rem;
                align-items: start;
            }

            .playerMain h2 {
                font-size: 1.55rem;
                line-height: 1.05;
                overflow-wrap: anywhere;
            }

            .scoreBlock {
                grid-column: 1 / -1;
                display: flex;
                align-items: baseline;
                gap: 0.4rem;
            }

            .componentGrid,
            .noteGrid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .cardActions,
            .concernBar {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .cardActions button,
            .concernBar button {
                min-width: 0;
            }

            .classicBoard,
            .draftLog {
                margin-inline: -0.45rem;
                border-radius: 0;
            }

            .classicHeader,
            .classicRow,
            .draftHeader,
            .draftRow {
                min-width: 700px;
            }
        }
    </style>

  }
}
</script>

<body>
    <div id="root"></div>
